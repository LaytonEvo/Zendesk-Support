[project]
name = "evogolf-support"
version = "0.1.0"
description = "Zendesk reply-drafting assistant for Evolution Golf"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "anthropic>=1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
evogolf = "evogolf_support.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# rules.json is data, not code, so setuptools leaves it out of the wheel
# unless told. Without this the service installs cleanly and then fails on
# the first draft with a missing-file error.
[tool.setuptools.package-data]
"evogolf_support.policy" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
